<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sway</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- SVG ICON LIBRARY -->
    <svg style="display: none;">
        <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
        <symbol id="icon-next" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
        <symbol id="icon-prev" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></symbol>
        <symbol id="icon-heart-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78v0z"/></symbol>
        <symbol id="icon-heart-filled" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></symbol>
        <symbol id="icon-more" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4zm0 6a2 2 0 110-4 2 2 0 010 4z"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol>
        <symbol id="icon-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></symbol>
        <symbol id="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></symbol>
        <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></symbol>
    </svg>

    <div class="home-bg"></div>

    <div id="app-container">
        
        <!-- HOME PAGE -->
        <main id="page-home" class="page active">
            <header class="page-header"><h1 class="brand-title">Sway</h1></header>
            <section class="content-section mb-4">
                <button id="btn-open-genres" class="btn-minimal block center">Browse Genres & Vibes</button>
            </section>
            <section class="content-section">
                <div id="home-song-list" class="song-list"></div>
            </section>
        </main>

        <!-- GENRES PAGE -->
        <main id="page-genres" class="page">
            <button id="btn-back-genres" class="icon-btn mb-4"><svg class="icon"><use href="#icon-close"></use></svg></button>
            <header class="page-header"><h1 class="brand-title">Discover</h1></header>
            <div class="pill-container" id="genres-list"></div>
        </main>

        <!-- SEARCH PAGE -->
        <main id="page-search" class="page">
            <header class="search-header">
                <div class="search-bar-minimal">
                    <svg class="icon"><use href="#icon-search"></use></svg>
                    <input type="text" id="search-input" placeholder="Search music...">
                </div>
            </header>
            <div id="search-results" class="song-list mt-4"></div>
        </main>

        <!-- PLAYLISTS PAGE -->
        <main id="page-playlists" class="page">
            <header class="header-flex page-header">
                <h1 class="brand-title">Library</h1>
                <button id="btn-create-playlist" class="btn-minimal">New</button>
            </header>
            
            <div class="liked-songs-card" id="btn-open-liked">
                <div class="icon-wrap"><svg class="icon"><use href="#icon-heart-filled"></use></svg></div>
                <div class="song-info"><h4>Liked Songs</h4><p id="liked-count">0 songs</p></div>
            </div>

            <div id="playlist-list" class="song-list mt-4"></div>
            
            <!-- Playlist View -->
            <div id="playlist-view" class="hidden">
                <button id="btn-back-playlists" class="icon-btn mb-4"><svg class="icon"><use href="#icon-close"></use></svg></button>
                <h2 id="playlist-view-title" class="brand-title mb-4">Playlist</h2>
                
                <div class="playlist-controls header-flex mb-4">
                    <button id="btn-play-playlist" class="btn-primary small">Play</button>
                    <div style="display:flex; gap: 8px;">
                        <button id="btn-pl-shuffle" class="icon-btn state-btn"><svg class="icon"><use href="#icon-shuffle"></use></svg></button>
                        <button id="btn-pl-repeat" class="icon-btn state-btn"><svg class="icon"><use href="#icon-repeat"></use></svg></button>
                        <button id="btn-pl-smart" class="icon-btn state-btn"><svg class="icon"><use href="#icon-sparkle"></use></svg></button>
                    </div>
                </div>
                
                <button id="btn-add-to-playlist" class="btn-minimal block mb-4">Add Songs</button>
                <div id="playlist-view-songs" class="song-list"></div>
            </div>
        </main>

        <!-- DYNAMIC PROFILE PAGES (Artist / Genre) -->
        <main id="page-profile" class="page">
            <button id="btn-back-profile" class="icon-btn mb-4"><svg class="icon"><use href="#icon-close"></use></svg></button>
            <p id="profile-subtitle" class="sub-text">CATEGORY</p>
            <h1 id="profile-title" class="brand-title mb-4">Name</h1>
            <div class="header-flex mb-4">
                <button id="btn-play-profile" class="btn-primary small">Play All</button>
            </div>
            <div id="profile-song-list" class="song-list"></div>
        </main>

        <!-- SETTINGS PAGE -->
        <main id="page-settings" class="page">
            <header class="page-header"><h1 class="brand-title">Settings</h1></header>
            <div class="settings-content">
                <div class="info-card minimal-border">
                    <p><strong>Database Status</strong></p>
                    <p class="sub-text" id="db-status-text">Local Storage Active.<br>Awaiting backend migration.</p>
                </div>
                <div id="btn-dev-access" class="dev-card minimal-border mt-4">Developer Login</div>
            </div>
        </main>

        <!-- EDITOR PAGE -->
        <main id="page-editor" class="page">
            <header class="page-header"><h1 class="brand-title">Editor</h1></header>
            
            <div class="editor-card minimal-border mb-4">
                <input type="file" id="edit-audio" accept="audio/*" class="input-line">
                <label class="sub-text block mb-4">Upload MP3</label>
                
                <input type="file" id="edit-art" accept="image/*" class="input-line">
                <label class="sub-text block mb-4">Upload Cover (Optional)</label>
                
                <input type="text" id="edit-title" placeholder="Song Title" class="input-line">
                <input type="text" id="edit-artist" placeholder="Artist Name" class="input-line">
                <input type="text" id="edit-genre" placeholder="Genre (e.g. Hip Hop, 90s)" class="input-line">
                <input type="text" id="edit-vibe" placeholder="Vibe (e.g. Punjabi, Phonk, Sad)" class="input-line">
                
                <button id="btn-save-song" class="btn-primary mt-4">Add Song</button>
            </div>

            <div class="search-bar-minimal mb-4">
                <svg class="icon"><use href="#icon-search"></use></svg>
                <input type="text" id="editor-search-input" placeholder="Search database to edit/delete...">
            </div>

            <div id="editor-song-list" class="song-list"></div>
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav id="bottom-nav">
            <button class="nav-btn active" data-target="page-home">Home</button>
            <button class="nav-btn" data-target="page-search">Search</button>
            <button class="nav-btn" data-target="page-playlists">Library</button>
            <button class="nav-btn" data-target="page-settings">Settings</button>
            <button class="nav-btn hidden" id="nav-editor" data-target="page-editor">Editor</button>
        </nav>

        <!-- MAIN HORIZONTAL PLAYER -->
        <div id="main-player" class="hidden">
            <div class="player-art-wrap">
                <img id="player-art" src="" alt="Art">
            </div>
            
            <div class="player-controls-wrap">
                <div class="player-info-row">
                    <div class="player-text">
                        <h4 id="player-title">No song</h4>
                        <p id="player-artist" class="sub-text click-text">Artist</p>
                    </div>
                    <div style="display:flex; gap: 4px;">
                        <button id="btn-player-like" class="icon-btn" style="padding: 4px;"><svg class="icon"><use href="#icon-heart-outline"></use></svg></button>
                        <button id="btn-player-more" class="icon-btn" style="padding: 4px;"><svg class="icon"><use href="#icon-more"></use></svg></button>
                    </div>
                </div>
                
                <div class="progress-container">
                    <input type="range" id="progress-bar" value="0" max="100">
                    <div class="time-info">
                        <span id="current-time">0:00</span>
                        <span id="duration">-:-</span>
                    </div>
                </div>
                
                <div class="controls-row">
                    <button id="btn-shuffle" class="icon-btn state-btn"><svg class="icon"><use href="#icon-shuffle"></use></svg></button>
                    <button id="btn-prev" class="icon-btn"><svg class="icon"><use href="#icon-prev"></use></svg></button>
                    <button id="btn-playpause" class="icon-btn play-circle"><svg class="icon"><use href="#icon-play"></use></svg></button>
                    <button id="btn-next" class="icon-btn"><svg class="icon"><use href="#icon-next"></use></svg></button>
                    <button id="btn-repeat" class="icon-btn state-btn active"><svg class="icon"><use href="#icon-repeat"></use></svg></button>
                </div>
            </div>
        </div>

        <!-- 3-DOTS ACTION SHEET -->
        <div id="action-sheet" class="modal-overlay hidden">
            <div class="sheet-content">
                <div class="sheet-header">
                    <img id="sheet-art" src="" alt="">
                    <div><h4 id="sheet-title">Title</h4><p id="sheet-artist" class="sub-text">Artist</p></div>
                </div>
                <div class="sheet-options">
                    <button id="sheet-btn-like" class="sheet-btn"><svg class="icon"><use href="#icon-heart-outline"></use></svg> <span>Like</span></button>
                    <button id="sheet-btn-artist" class="sheet-btn"><svg class="icon"><use href="#icon-search"></use></svg> <span>View Artist</span></button>
                    <button id="sheet-btn-add" class="sheet-btn"><svg class="icon"><use href="#icon-play"></use></svg> <span>Add to Playlist</span></button>
                    <button id="sheet-btn-delete" class="sheet-btn hidden delete-red"><svg class="icon"><use href="#icon-trash"></use></svg> <span>Delete from App</span></button>
                </div>
                <button id="sheet-btn-close" class="btn-minimal mt-4 block center">Cancel</button>
            </div>
        </div>

        <!-- CUSTOM MINIMAL MODAL -->
        <div id="custom-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <h3 id="modal-title" class="mb-4">Title</h3>
                <p id="modal-desc" class="sub-text hidden mb-4">Description</p>
                <input type="text" id="modal-input" class="input-line hidden" placeholder="...">
                <div id="modal-search-wrapper" class="search-bar-minimal hidden mb-4">
                    <svg class="icon"><use href="#icon-search"></use></svg>
                    <input type="text" id="modal-search-input" placeholder="Search...">
                </div>
                <div id="modal-list" class="song-list hidden" style="max-height: 250px; overflow-y: auto;"></div>
                <div class="modal-actions">
                    <button id="modal-btn-cancel" class="btn-minimal">Cancel</button>
                    <button id="modal-btn-confirm" class="btn-primary small">Confirm</button>
                </div>
            </div>
        </div>

    </div>
    
    <script type="module" src="storage.js"></script>
    <script type="module" src="player.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
